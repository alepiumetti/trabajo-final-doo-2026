# Configuración de conexión y rutas del sistema EcoGrid
#
# db_path   : base de datos SQLite3 donde se persisten los ticks.
# datos_dir : carpeta con los ofertas_HH.csv (un archivo por hora).
# sql_path  : script de esquema (tablas, semilla, trigger).
# fecha_simulada : fecha base del día simulado. Se combina con la hora
#              del tick para armar el timestamp de LECTURAS_HISTORICAS
#              (el PDF pide tick_hora como DATE "timestamp simulado").
db_path=./ejemplo.db
datos_dir=./datos
sql_path=./sql/crear_esquema.sql
fecha_simulada=2026-06-01
